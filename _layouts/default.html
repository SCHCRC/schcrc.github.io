<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon/favicon-32x32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon/favicon-16x16.png' | relative_url }}">
    <link rel="shortcut icon" href="{{ '/assets/favicon/favicon.ico' | relative_url }}">
    <meta name="theme-color" content="#070b14">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=JetBrains+Mono:wght@400&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% seo %}
  </head>
  <body>
    <div class="site-topbar">
      <div class="site-shell site-topbar__inner">
        <span>SCH CYBER SECURITY RESEARCH CENTER</span>
        <span>Official Website</span>
      </div>
    </div>
    <header class="site-header">
      <div class="site-shell site-header__inner">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand__mark">
            <img src="{{ '/assets/branding/센터.png' | relative_url }}" alt="SCH사이버보안연구센터 로고">
          </span>
          <span class="brand__text">
            <strong>SCH사이버보안연구센터</strong>
            <small>SCH Cybersecurity Research Center</small>
          </span>
        </a>
        <nav class="site-nav">
          <a href="{{ '/news/' | relative_url }}">센터 소식</a>
          <a href="{{ '/blog/' | relative_url }}">센터 블로그</a>
          <a href="{{ '/projects/' | relative_url }}">센터 프로젝트</a>
          <a href="{{ '/infrastructure/' | relative_url }}">센터 인프라</a>
          <a href="{{ '/researchers/' | relative_url }}">연구원 현황</a>
          <a href="{{ '/history/' | relative_url }}">센터 연혁</a>
        </nav>
      </div>
    </header>

    <main class="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-shell site-footer__inner">
        <div>
          <strong>{{ site.title }}</strong>
          <p>{{ site.description }}</p>
        </div>
        <div>
          <p>순천향대학교 산학협력단 산하</p>
          <p>공과대학 9332호</p>
        </div>
      </div>
    </footer>
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
